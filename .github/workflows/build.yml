name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Sistem paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - name: Onbellek
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
      - name: Buildozer
        run: |
          set -o pipefail
          pip install --upgrade pip
          pip install buildozer==1.5.0 "cython<3" virtualenv
          buildozer -v android debug 2>&1 | tee build.log
      - name: Hata ozeti
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' build.log > clean.log
          {
            echo '## Gradle hatasi'
            echo '```'
            grep -n -A 30 -i "What went wrong" clean.log | head -80 | cut -c1-300
            echo '```'
            echo '## Hata satirlari'
            echo '```'
            grep -n -E "FAILURE|error:|Error:|Exception|Could not|not found" clean.log | head -30 | cut -c1-300
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: ajan-apk
          path: bin/*.apk
          
